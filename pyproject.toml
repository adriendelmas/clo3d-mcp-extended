[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clo3d-mcp-extended"
version = "0.2.0"
description = "MCP server for CLO3D with 170 tools for pattern making and garment creation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Violet Sphinx" }, { name = "adriendelmas" }]
keywords = ["clo3d", "mcp", "fashion", "3d", "garment", "pattern-making", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["mcp[cli]>=1.3.0,<2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/adriendelmas/clo3d-mcp-extended"
Upstream = "https://github.com/Ubani-Studio/clo3d-mcp"

[project.scripts]
clo3d-mcp = "clo3d_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clo3d_mcp"]
